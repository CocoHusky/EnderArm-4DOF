name: Validate controller
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python scripts/check.py
      - run: python scripts/check-privacy.py
      - name: Check sensor build scripts
        run: |
          sh -n firmware/frdm-kl02z/build.sh
          sh -n firmware/frdm-kl02z/setup_toolchain_macos.sh
      - name: Package source for installation
        if: matrix.python == '3.13'
        run: tar --exclude='__pycache__' --exclude='firmware/frdm-kl02z/build' -czf enderarm-controller.tar.gz software firmware scripts docs README.md THIRD_PARTY.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.13'
        with:
          name: enderarm-controller
          path: enderarm-controller.tar.gz
