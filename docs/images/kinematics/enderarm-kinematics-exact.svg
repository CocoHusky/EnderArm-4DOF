<rect class="box" x="1100" y="125" width="430" height="275" rx="10"/><text x="1125" y="162" class="h">Four powered coordinates</text>
<text x="1125" y="200" class="t"><tspan font-weight="700">s</tspan> — Linear base travel</text><text x="1155" y="224" class="t">translates the complete arm on the Ender rail</text>
<text x="1125" y="256" class="t"><tspan font-weight="700">ψ</tspan> — Base yaw</text><text x="1155" y="280" class="t">rotates the complete Y–Z linkage about vertical Z</text>
<text x="1125" y="312" class="t"><tspan font-weight="700">qX</tspan> — Main-arm joint</text><text x="1155" y="336" class="t">90T output drives A → C, 120 mm</text>
<text x="1125" y="368" class="t"><tspan font-weight="700">qY</tspan> — Crank joint</text><text x="1155" y="392" class="t">90T output drives A → B, 40 mm</text>
<rect class="box" x="1100" y="425" width="430" height="265" rx="10"/><text x="1125" y="462" class="h">Exact model dimensions</text>
<text x="1125" y="500" class="t">AB = 40     AC = 120</text><text x="1125" y="529" class="t">BF = 120   CF = 40   CH = 120</text><text x="1125" y="558" class="t">AG = CE = 32</text><text x="1125" y="587" class="t">CD = HI = 25</text><text x="1125" y="616" class="t">DE = 45</text><text x="1125" y="645" class="t">GE = DI = 120</text><text x="1125" y="674" class="t">HT = 27</text>
<rect class="box" x="1100" y="715" width="430" height="185" rx="10"/><text x="1125" y="752" class="h">Closed-linkage relationship</text>
<text x="1125" y="790" class="t">|F − B| = 120     |F − C| = 40</text><text x="1125" y="818" class="t">H = C + 3(C − F)</text><text x="1125" y="846" class="t">T = H + [27, 0]</text><text x="1125" y="874" class="t">20T motor → 90T output = 4.5:1</text>
